services:
  rabbitmq:
    image: "rabbitmq:3-management"
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"

  flask-app:
    build: .
    env_file: ./.env
    ports:
      - "5000:5000"
    depends_on:
      - rabbitmq
      - redis
    environment:
      - PYTHONUNBUFFERED=1

  consumer:
    build: .
    env_file: ./.env
    command: python consumer.py
    depends_on:
      rabbitmq:
          condition: service_healthy